<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Candao International Website - C v3</title>
    <style>
      :root {
        --blue: #528dff;
        --blue-deep: #1f5ed8;
        --ink: #101827;
        --muted: #5f6b7c;
        --soft: #f5f8fc;
        --line: #dbe3ef;
        --surface: #ffffff;
        --green: #0f766e;
        --amber: #b7791f;
        --rose: #be3b5b;
        --shadow: 0 22px 72px rgba(16, 24, 39, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--ink);
        background: var(--soft);
        font-family:
          Inter,
          "Noto Sans TC",
          "PingFang TC",
          "Microsoft JhengHei",
          Arial,
          sans-serif;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .site-header {
        position: sticky;
        top: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 22px;
        min-height: 72px;
        padding: 0 clamp(20px, 5vw, 72px);
        border-bottom: 1px solid rgba(219, 227, 239, 0.82);
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(18px);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        min-width: 142px;
        font-weight: 760;
      }

      .mark {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: linear-gradient(135deg, #1747b2, var(--blue) 62%, #a9caff);
        box-shadow: 0 12px 26px rgba(82, 141, 255, 0.28);
      }

      .nav {
        display: flex;
        align-items: center;
        gap: 4px;
        overflow-x: auto;
      }

      .nav button {
        min-width: fit-content;
        height: 40px;
        padding: 0 12px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: #344256;
        cursor: pointer;
        white-space: nowrap;
      }

      .nav button:hover,
      .nav button.active {
        color: var(--blue-deep);
        background: #eaf2ff;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .lang {
        color: var(--muted);
        font-size: 13px;
        white-space: nowrap;
      }

      .cta,
      .ghost {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        padding: 0 18px;
        border-radius: 8px;
        cursor: pointer;
        white-space: nowrap;
      }

      .cta {
        border: 0;
        color: #fff;
        background: var(--blue);
        box-shadow: 0 12px 28px rgba(82, 141, 255, 0.28);
      }

      .ghost {
        border: 1px solid var(--line);
        color: var(--ink);
        background: rgba(255, 255, 255, 0.86);
      }

      .hero {
        position: relative;
        min-height: 730px;
        display: grid;
        align-items: center;
        padding: clamp(48px, 6vw, 92px) clamp(20px, 5vw, 72px);
        color: #fff;
        background: #07111f;
        overflow: hidden;
      }

      .hero img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.72;
      }

      .hero::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(90deg, rgba(7, 17, 31, 0.95), rgba(7, 17, 31, 0.72) 42%, rgba(7, 17, 31, 0.25)),
          linear-gradient(180deg, rgba(7, 17, 31, 0.06), rgba(7, 17, 31, 0.48));
      }

      .hero-inner {
        position: relative;
        z-index: 2;
        width: min(1320px, 100%);
        margin: 0 auto;
        display: grid;
        grid-template-columns: minmax(320px, 0.95fr) minmax(400px, 1.05fr);
        gap: clamp(28px, 5vw, 74px);
        align-items: center;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        min-height: 30px;
        padding: 0 10px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 8px;
        color: rgba(255, 255, 255, 0.86);
        background: rgba(255, 255, 255, 0.08);
        font-size: 13px;
      }

      .hero h1 {
        max-width: 760px;
        margin: 24px 0 18px;
        font-size: clamp(44px, 5vw, 76px);
        line-height: 1.05;
        letter-spacing: 0;
      }

      .hero p {
        max-width: 660px;
        margin: 0 0 28px;
        color: rgba(255, 255, 255, 0.82);
        font-size: clamp(17px, 1.45vw, 21px);
        line-height: 1.72;
      }

      .hero-actions,
      .button-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .hero-panel,
      .product-panel,
      .scene-panel {
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.9);
        color: var(--ink);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .hero-panel {
        justify-self: end;
        width: min(580px, 100%);
      }

      .panel-head {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        min-height: 56px;
        padding: 0 18px;
        align-items: center;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.78);
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 13px;
      }

      .dot {
        width: 9px;
        height: 9px;
        border-radius: 99px;
        background: var(--green);
      }

      .panel-body {
        padding: 18px;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .metric {
        min-height: 112px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }

      .metric small {
        color: var(--muted);
      }

      .metric strong {
        display: block;
        margin: 8px 0;
        font-size: 24px;
      }

      .bar {
        height: 8px;
        border-radius: 99px;
        background: #e8edf6;
        overflow: hidden;
      }

      .bar span {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--blue), #21b7a8);
      }

      .section {
        padding: clamp(56px, 7vw, 106px) clamp(20px, 5vw, 72px);
      }

      .section-inner {
        width: min(1320px, 100%);
        margin: 0 auto;
      }

      .section-kicker {
        color: var(--blue-deep);
        font-size: 14px;
        font-weight: 720;
      }

      .section h2 {
        max-width: 860px;
        margin: 14px 0 16px;
        font-size: clamp(30px, 3.4vw, 50px);
        line-height: 1.12;
        letter-spacing: 0;
      }

      .section-lead {
        max-width: 760px;
        margin: 0 0 30px;
        color: var(--muted);
        font-size: 17px;
        line-height: 1.72;
      }

      .split {
        display: grid;
        grid-template-columns: minmax(280px, 0.82fr) minmax(420px, 1.18fr);
        gap: 26px;
        align-items: start;
      }

      .rail {
        display: grid;
        gap: 10px;
      }

      .rail button {
        width: 100%;
        min-height: 58px;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        text-align: left;
        cursor: pointer;
      }

      .rail button.active {
        border-color: rgba(82, 141, 255, 0.5);
        background: #edf4ff;
        color: var(--blue-deep);
      }

      .scene-panel,
      .product-panel {
        border-color: var(--line);
        background: #fff;
      }

      .panel-grid {
        display: grid;
        grid-template-columns: minmax(260px, 0.85fr) minmax(320px, 1.15fr);
        gap: 18px;
        padding: 18px;
      }

      .media-tile {
        position: relative;
        min-height: 340px;
        border-radius: 8px;
        overflow: hidden;
        background: #0d1625;
      }

      .media-tile img {
        width: 100%;
        height: 100%;
        min-height: inherit;
        object-fit: cover;
        opacity: 0.84;
      }

      .media-caption {
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: 16px;
        padding: 14px;
        border-radius: 8px;
        color: #fff;
        background: rgba(8, 17, 31, 0.72);
        backdrop-filter: blur(14px);
      }

      .panel-content h3 {
        margin: 4px 0 12px;
        font-size: clamp(24px, 2.4vw, 34px);
        line-height: 1.16;
      }

      .panel-content p {
        color: var(--muted);
        line-height: 1.72;
      }

      .state-boxes {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin: 18px 0;
      }

      .state-box {
        min-height: 112px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f8fafc;
      }

      .state-box span {
        display: block;
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 13px;
      }

      .tag-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        min-height: 30px;
        padding: 0 10px;
        border: 1px solid #cfd8e6;
        border-radius: 8px;
        color: #334155;
        background: #fff;
        font-size: 13px;
      }

      .product-ui {
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: linear-gradient(180deg, #f8fbff, #fff);
      }

      .ui-top {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin-bottom: 14px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        padding: 0 9px;
        border-radius: 8px;
        color: var(--blue-deep);
        background: #eaf2ff;
        font-size: 13px;
      }

      .workflow {
        display: grid;
        gap: 10px;
      }

      .workflow-item {
        display: grid;
        grid-template-columns: 32px 1fr auto;
        gap: 10px;
        align-items: center;
        min-height: 56px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }

      .num {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 8px;
        color: #fff;
        background: var(--blue);
        font-size: 13px;
        font-weight: 740;
      }

      .flow-status {
        color: var(--green);
        font-size: 13px;
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
      }

      .card {
        min-height: 172px;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }

      .card h3 {
        margin: 0 0 10px;
        font-size: 20px;
      }

      .card p {
        margin: 0;
        color: var(--muted);
        line-height: 1.62;
      }

      .resource-grid {
        display: grid;
        grid-template-columns: 0.82fr 1.18fr;
        gap: 18px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      input,
      select,
      textarea {
        width: 100%;
        min-height: 46px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--ink);
        background: #fff;
      }

      textarea {
        min-height: 116px;
        padding-top: 12px;
        resize: vertical;
      }

      .footer {
        padding: 34px clamp(20px, 5vw, 72px);
        color: #d5deeb;
        background: #101827;
      }

      .footer-inner {
        width: min(1320px, 100%);
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        gap: 20px;
        flex-wrap: wrap;
      }

      @media (max-width: 1080px) {
        .site-header {
          align-items: flex-start;
          min-height: 118px;
          padding-top: 16px;
          flex-wrap: wrap;
        }

        .nav {
          order: 3;
          width: 100%;
          padding-bottom: 12px;
        }

        .hero-inner,
        .split,
        .panel-grid,
        .resource-grid {
          grid-template-columns: 1fr;
        }

        .hero-panel {
          justify-self: stretch;
        }

        .cards {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (max-width: 720px) {
        .header-actions .cta {
          display: none;
        }

        .hero {
          min-height: auto;
        }

        .hero h1 {
          font-size: 40px;
        }

        .metrics,
        .state-boxes,
        .cards,
        .form-grid {
          grid-template-columns: 1fr;
        }

        .media-tile {
          min-height: 260px;
        }
      }
    </style>
  </head>

        const lines = page === "solutions"

        return `
          <div class="hero-panel">
            <div class="panel-head">
              <strong>Candao Operations View</strong>
              <span class="status"><span class="dot"></span>即時同步</span>
            </div>
            <div class="panel-body">
              <div class="metrics">
                ${lines
                  .map((item, index) => `
                    <div class="metric">
                      <small>${item}</small>
                      <strong>${index === 0 ? "01" : "0" + (index + 1)}</strong>

      function renderHome() {

      function renderSolutions() {

              </div>

      function cardsSection(title, items) {

                `).join("")}
              </div>
            </div>

        `;

      function bindInteractions() {
        document.querySelectorAll("[data-solution]").forEach((button) => {
          button.addEventListener("click", () => {
            state.solution = Number(button.dataset.solution);
            render();
          });
        });
        document.querySelectorAll("[data-capability]").forEach((button) => {
          button.addEventListener("click", () => {
            state.capability = Number(button.dataset.capability);
            render();
          });
        });
        document.querySelectorAll("[data-resource]").forEach((button) => {
          button.addEventListener("click", () => {
            state.resource = Number(button.dataset.resource);
            render();
          });
        });
        document.querySelectorAll("[data-contact]").forEach((button) => {
          button.addEventListener("click", () => {
            state.contact = Number(button.dataset.contact);
            render();
          });
        });
      }

      function render() {
        renderNav();
        const app = document.getElementById("app");
        const views = {
          home: renderHome,
          solutions: renderSolutions,
          platform: renderPlatform,
          integrations: renderIntegrations,
          customers: renderCustomers,
          resources: renderResources,
          about: renderAbout,
          contact: renderContact
        };
        app.innerHTML = (views[state.page] || views.home)();
        document.querySelectorAll("[data-page]").forEach((button) => {
          button.addEventListener("click", () => setPage(button.dataset.page));
        });
        bindInteractions();
      }

      render();
    </script>
  </body>
</html>
