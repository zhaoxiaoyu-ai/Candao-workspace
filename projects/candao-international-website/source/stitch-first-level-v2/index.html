<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Candao International Website - C v2 First Level Pages</title>
    <style>
      :root {
        --blue: #528dff;
        --blue-dark: #1f5ed8;
        --ink: #101827;
        --muted: #5a6475;
        --line: #d9e1ee;
        --cloud: #f6f8fb;
        --surface: #ffffff;
        --teal: #0f766e;
        --amber: #f59e0b;
        --red: #dc2626;
        --shadow: 0 18px 60px rgba(16, 24, 39, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family:
          Inter,
          "Noto Sans TC",
          "PingFang TC",
          "Microsoft JhengHei",
          Arial,
          sans-serif;
        color: var(--ink);
        background: var(--cloud);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button,
      input,
      select {
        font: inherit;
      }

      .site-header {
        position: sticky;
        top: 0;
        z-index: 30;
        height: 72px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 clamp(20px, 5vw, 72px);
        border-bottom: 1px solid rgba(217, 225, 238, 0.84);
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(18px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 760;
        color: var(--ink);
      }

      .mark {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background:
          linear-gradient(135deg, #184cba 0%, var(--blue) 62%, #9cc2ff 100%);
        box-shadow: 0 10px 24px rgba(82, 141, 255, 0.28);
      }

      .nav {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .nav button {
        min-width: 76px;
        height: 40px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: #334155;
        cursor: pointer;
        transition:
          background 180ms ease,
          color 180ms ease;
      }

      .nav button:hover,
      .nav button.active {
        color: var(--blue-dark);
        background: #edf4ff;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .lang {
        color: var(--muted);
        font-size: 13px;
        white-space: nowrap;
      }

      .cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        padding: 0 18px;
        border: 0;
        border-radius: 8px;
        color: white;
        background: var(--blue);
        cursor: pointer;
        box-shadow: 0 12px 28px rgba(82, 141, 255, 0.28);
      }

      .ghost {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        padding: 0 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.85);
        cursor: pointer;
      }

      main {
        overflow: hidden;
      }

      .hero {
        position: relative;
        min-height: 760px;
        display: grid;
        align-items: center;
        padding: clamp(44px, 6vw, 92px) clamp(20px, 5vw, 72px);
        background: #08111f;
        color: white;
      }

      .hero img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.78;
      }

      .hero::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(90deg, rgba(7, 16, 31, 0.94) 0%, rgba(7, 16, 31, 0.72) 34%, rgba(7, 16, 31, 0.18) 74%),
          linear-gradient(180deg, rgba(7, 16, 31, 0.1), rgba(7, 16, 31, 0.36));
      }

      .hero-inner {
        position: relative;
        z-index: 2;
        width: min(1320px, 100%);
        margin: 0 auto;
        display: grid;
        grid-template-columns: minmax(320px, 0.9fr) minmax(420px, 1.1fr);
        gap: clamp(28px, 4vw, 72px);
        align-items: center;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 30px;
        padding: 0 10px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 8px;
        color: rgba(255, 255, 255, 0.86);
        background: rgba(255, 255, 255, 0.08);
        font-size: 13px;
      }

      .hero h1 {
        max-width: 720px;
        margin: 24px 0 18px;
        font-size: clamp(44px, 5vw, 76px);
        line-height: 1.05;
        letter-spacing: 0;
      }

      .hero p {
        max-width: 640px;
        margin: 0 0 28px;
        color: rgba(255, 255, 255, 0.82);
        font-size: clamp(17px, 1.45vw, 21px);
        line-height: 1.72;
      }

      .hero-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .hero-panel {
        justify-self: end;
        width: min(560px, 100%);
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.86);
        color: var(--ink);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 56px;
        padding: 0 18px;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.78);
      }

      .status-dot {
        width: 9px;
        height: 9px;
        border-radius: 99px;
        background: var(--teal);
      }

      .mini-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        padding: 18px;
      }

      .metric {
        min-height: 108px;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
      }

      .metric small {
        color: var(--muted);
      }

      .metric strong {
        display: block;
        margin-top: 8px;
        font-size: 26px;
      }

      .metric span {
        display: inline-flex;
        margin-top: 12px;
        color: var(--teal);
        font-size: 13px;
      }

      .section {
        padding: clamp(70px, 7vw, 112px) clamp(20px, 5vw, 72px);
        background: var(--surface);
      }

      .section.alt {
        background: var(--cloud);
      }

      .section-inner {
        width: min(1320px, 100%);
        margin: 0 auto;
      }

      .section-title {
        display: grid;
        grid-template-columns: minmax(260px, 0.9fr) minmax(260px, 0.75fr);
        gap: 36px;
        align-items: end;
        margin-bottom: 36px;
      }

      .section-title h2 {
        margin: 0;
        font-size: clamp(32px, 3.2vw, 54px);
        line-height: 1.12;
        letter-spacing: 0;
      }

      .section-title p {
        margin: 0;
        color: var(--muted);
        font-size: 17px;
        line-height: 1.8;
      }

      .visual-slab {
        display: grid;
        grid-template-columns: 0.9fr 1.1fr;
        gap: 24px;
        align-items: stretch;
      }

      .image-frame {
        min-height: 520px;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: var(--shadow);
        background: #dbe6f7;
      }

      .image-frame img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .image-frame.contain img {
        object-fit: contain;
        padding: 24px;
        background: white;
      }

      .map-panel,
      .form-panel,
      .case-panel {
        min-height: 520px;
        padding: 26px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
        box-shadow: 0 14px 46px rgba(16, 24, 39, 0.08);
      }

      .tab-row,
      .chip-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 24px;
      }

      .tab,
      .chip {
        min-height: 38px;
        padding: 0 13px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: #334155;
        background: white;
        cursor: pointer;
      }

      .tab.active,
      .chip.active {
        color: var(--blue-dark);
        border-color: rgba(82, 141, 255, 0.62);
        background: #edf4ff;
      }

      .capability-map {
        position: relative;
        min-height: 420px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        background:
          radial-gradient(circle at center, rgba(82, 141, 255, 0.16), transparent 34%),
          linear-gradient(180deg, #ffffff, #f8fbff);
      }

      .center-node {
        position: relative;
        z-index: 2;
        display: grid;
        place-items: center;
        width: 154px;
        height: 154px;
        border-radius: 8px;
        color: white;
        background: var(--blue);
        box-shadow: 0 20px 60px rgba(82, 141, 255, 0.36);
        text-align: center;
        font-weight: 760;
      }

      .node {
        position: absolute;
        min-width: 138px;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
        box-shadow: 0 10px 28px rgba(16, 24, 39, 0.08);
        cursor: pointer;
      }

      .node.active {
        color: var(--blue-dark);
        border-color: rgba(82, 141, 255, 0.72);
        background: #edf4ff;
      }

      .node small {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
      }

      .node:nth-child(2) {
        top: 44px;
        left: 50%;
        transform: translateX(-50%);
      }

      .node:nth-child(3) {
        top: 120px;
        right: 44px;
      }

      .node:nth-child(4) {
        bottom: 60px;
        right: 88px;
      }

      .node:nth-child(5) {
        bottom: 60px;
        left: 88px;
      }

      .node:nth-child(6) {
        top: 120px;
        left: 44px;
      }

      .flow-line {
        position: absolute;
        inset: 86px 120px;
        border: 1px dashed rgba(82, 141, 255, 0.4);
        border-radius: 50%;
      }

      .details {
        margin-top: 20px;
        display: grid;
        gap: 12px;
      }

      .detail-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfdff;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 28px;
        padding: 0 9px;
        border-radius: 8px;
        background: #e9fbf7;
        color: var(--teal);
        font-size: 13px;
        white-space: nowrap;
      }

      .badge.warn {
        background: #fff7e6;
        color: var(--amber);
      }

      .grid-3 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }

      .grid-4 {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
      }

      .info-card {
        min-height: 184px;
        padding: 22px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
        transition:
          transform 180ms ease,
          box-shadow 180ms ease,
          border-color 180ms ease;
      }

      .info-card:hover {
        transform: translateY(-4px);
        border-color: rgba(82, 141, 255, 0.54);
        box-shadow: 0 16px 38px rgba(16, 24, 39, 0.1);
      }

      .info-card h3 {
        margin: 0 0 10px;
        font-size: 21px;
      }

      .info-card p {
        margin: 0;
        color: var(--muted);
        line-height: 1.72;
      }

      .stepper {
        display: grid;
        grid-template-columns: 0.7fr 1.3fr;
        gap: 24px;
      }

      .step-list {
        display: grid;
        gap: 10px;
      }

      .step {
        display: grid;
        grid-template-columns: 36px 1fr;
        gap: 12px;
        align-items: center;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
        cursor: pointer;
      }

      .step.active {
        border-color: rgba(82, 141, 255, 0.62);
        background: #edf4ff;
      }

      .step-num {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border-radius: 8px;
        color: white;
        background: var(--blue);
        font-weight: 760;
      }

      .demo-screen {
        min-height: 370px;
        padding: 22px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background:
          linear-gradient(135deg, #ffffff 0%, #f7fbff 100%);
        box-shadow: var(--shadow);
      }

      .fake-chart {
        height: 150px;
        margin-top: 16px;
        border-radius: 8px;
        background:
          linear-gradient(180deg, rgba(82, 141, 255, 0.12), rgba(82, 141, 255, 0.02)),
          repeating-linear-gradient(90deg, transparent 0 42px, rgba(217, 225, 238, 0.7) 42px 43px),
          linear-gradient(120deg, transparent 0 20%, rgba(82, 141, 255, 0.32) 20% 22%, transparent 22% 40%, rgba(15, 118, 110, 0.32) 40% 42%, transparent 42% 67%, rgba(245, 158, 11, 0.32) 67% 69%, transparent 69%);
      }

      .form-panel label {
        display: block;
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 13px;
      }

      .field-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
      }

      .field {
        width: 100%;
        min-height: 46px;
        padding: 0 13px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfdff;
      }

      .footer {
        padding: 48px clamp(20px, 5vw, 72px);
        color: #d8e4f7;
        background: #0b1220;
      }

      .footer-inner {
        width: min(1320px, 100%);
        margin: 0 auto;
        display: grid;
        grid-template-columns: 1.1fr repeat(5, 1fr);
        gap: 24px;
      }

      .footer h4,
      .footer strong {
        color: white;
      }

      .footer a,
      .footer p {
        display: block;
        margin: 8px 0;
        color: #aebed4;
        line-height: 1.6;
      }

      @media (max-width: 980px) {
        .site-header {
          height: auto;
          min-height: 72px;
          align-items: flex-start;
          flex-direction: column;
          gap: 12px;
          padding-top: 16px;
          padding-bottom: 16px;
        }

        .nav {
          width: 100%;
          overflow-x: auto;
          padding-bottom: 2px;
        }

        .hero {
          min-height: auto;
        }

        .hero-inner,
        .section-title,
        .visual-slab,
        .stepper,
        .footer-inner {
          grid-template-columns: 1fr;
        }

        .hero-panel {
          justify-self: stretch;
        }

        .grid-3,
        .grid-4,
        .field-grid {
          grid-template-columns: 1fr;
        }

        .image-frame,
        .map-panel,
        .form-panel,
        .case-panel {
          min-height: auto;
        }

        .capability-map {
          min-height: 640px;
        }

        .node {
          position: static;
          transform: none !important;
          margin: 8px;
        }

        .flow-line,
        .center-node {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="?page=home" aria-label="Candao 首頁">
        <span class="mark"></span>
        <span>Candao</span>
      </a>
      <nav class="nav" id="nav"></nav>
      <div class="header-actions">
        <span class="lang">繁中 / EN</span>
        <button class="cta" data-page="contact">預約產品演示</button>
      </div>
    </header>

    <main id="app"></main>

    <script>
      const assets = {
        home: "assets/home-hero-restaurant-ops-2026-08-08.png",
        solutions: "assets/solutions-hero-multistore-ops-2026-08-08.png",
        platform: "assets/platform-capability-ui-2026-08-08.png",
        integrations: "assets/integrations-ecosystem-ui-2026-08-08.png",
        customers: "assets/customers-hero-case-ops-2026-08-08.png",
        about: "assets/about-contact-service-ops-2026-08-08.png",
        contact: "assets/about-contact-service-ops-2026-08-08.png"
      };

      const navItems = [
        ["home", "首頁"],
        ["solutions", "解決方案"],
        ["platform", "平台"],
        ["integrations", "整合能力"],
        ["customers", "客戶案例"],
        ["about", "關於 Candao"]
      ];

      const capabilityCopy = {
        訂單管理: ["新訂單進入平台", "已自動歸類", "門店工作流已更新"],
        配送管理: ["配送訂單進行中", "異常訂單已高亮", "建議處理動作已生成"],
        菜單與門店管理: ["菜單更新已建立", "渠道同步進行中", "門店狀態保持一致"],
        自有點餐: ["顧客正在品牌入口下單", "會員資料已識別", "訂單回流至營運平台"],
        數據智能: ["營運指標已更新", "異常趨勢已標記", "下一步行動已建議"]
      };

      const pages = {
        home: {
          active: "home",
          eyebrow: "首頁",
          title: "讓餐飲營運，從多平台混亂走向一個清晰系統",
          text: "Candao 連接訂單、菜單、門店、配送與數據，協助餐飲品牌在多市場、多門店中穩定營運與持續成長。",
          image: assets.home,
          primary: "預約產品演示",
          secondary: "探索平台能力",
          sections: ["capability", "solutions", "workflow", "trust"]
        },
        solutions: {
          active: "solutions",
          eyebrow: "解決方案",
          title: "從營運問題出發，找到適合的 Candao 解決方案",
          text: "無論你正在管理連鎖品牌、多門店、配送流程或自有點餐渠道，Candao 都能將複雜流程轉化為可管理的營運系統。",
          image: assets.solutions,
          primary: "選擇你的場景",
          secondary: "查看平台能力",
          sections: ["scenarioDetail", "problemFlow", "related"]
        },
        platform: {
          active: "platform",
          eyebrow: "平台",
          title: "餐飲營運的核心能力，連接在同一個平台",
          text: "Candao 將訂單、菜單、門店、配送、自有點餐與數據智能連接，讓團隊以一致的流程管理複雜營運。",
          image: assets.platform,
          primary: "探索平台能力",
          secondary: "預約產品演示",
          sections: ["platformVisual", "capability", "workflow", "productEntries"]
        },
        integrations: {
          active: "integrations",
          eyebrow: "整合能力",
          title: "連接餐飲營運需要的關鍵系統",
          text: "Candao 可與外送平台、POS、支付、CRM、物流和內部系統整合，讓資料和流程不再割裂。",
          image: assets.integrations,
          primary: "查看整合能力",
          secondary: "申請整合",
          sections: ["integrationDirectory", "dataFlow", "integrationCTA"]
        },
        customers: {
          active: "customers",
          eyebrow: "客戶案例",
          title: "看 Candao 如何支援餐飲品牌穩定成長",
          text: "從多門店管理到配送協同，Candao 協助團隊將複雜營運變得清晰可控。",
          image: assets.customers,
          primary: "查看案例",
          secondary: "預約相似場景演示",
          sections: ["caseFilter", "caseStory", "caseMap"]
        },
        about: {
          active: "about",
          eyebrow: "關於 Candao",
          title: "為餐飲品牌打造可持續擴展的營運平台",
          text: "Candao 專注於餐飲營運數字化，協助品牌連接渠道、門店、配送與數據，支援跨市場成長。",
          image: assets.about,
          primary: "聯絡 Candao",
          secondary: "了解服務方式",
          sections: ["positioning", "serviceTabs", "security"]
        },
        contact: {
          active: "contact",
          eyebrow: "預約演示",
          title: "預約 Candao 產品演示",
          text: "告訴我們你的門店規模、渠道組合與營運挑戰，我們會安排合適的團隊與你討論。",
          image: assets.contact,
          primary: "提交需求",
          secondary: "支援查詢",
          sections: ["needRouter", "demoForm", "expect"]
        }
      };

      const app = document.querySelector("#app");
      const nav = document.querySelector("#nav");

      function currentPage() {
        const page = new URLSearchParams(window.location.search).get("page");
        return pages[page] ? page : "home";
      }

      function setPage(id) {
        history.pushState({}, "", `?page=${id}`);
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function headerPanel(page) {

          接單: ["新訂單來自多個渠道", "平台已接收並標記來源"],
          分流: ["訂單等待分配", "已送入正確門店工作流"],
          履約: ["配送與備餐同步進行", "異常狀態即時高亮"],
          門店協同: ["門店狀態更新", "總部可以查看執行情況"],
          數據回饋: ["營運資料匯總", "下一步行動建議已生成"]
        };
        const container = document.querySelector("#stepDetails");
        const title = document.querySelector("#stepTitle");
        if (!container || !title) return;
        title.textContent = name;
        container.innerHTML = mapping[name]
          .map((item, index) => `<div class="detail-row"><strong>${item}</strong><span class="badge">${index === 0 ? "交互前" : "交互後"}</span></div>`)
          .join("");
      }

      function bindInteractions() {
        document.querySelectorAll("[data-page]").forEach((el) => {
          el.addEventListener("click", () => setPage(el.dataset.page));
        });

        document.querySelectorAll("[data-capability]").forEach((el) => {
          el.addEventListener("click", () => {
            document.querySelectorAll("[data-capability]").forEach((node) => node.classList.remove("active"));
            el.classList.add("active");
            renderCapabilityDetails(el.dataset.capability);
          });
        });

        document.querySelectorAll("[data-step]").forEach((el) => {
          el.addEventListener("click", () => {
            document.querySelectorAll("[data-step]").forEach((node) => node.classList.remove("active"));
            el.classList.add("active");
            renderStepDetails(el.dataset.step);
          });
        });
      }

      function render() {
        const pageId = currentPage();
        const page = pages[pageId];
        renderNav(page.active);
        app.innerHTML = `${hero(page)}${page.sections.map((name) => sectionRenderers[name]()).join("")}${footer()}`;
        renderCapabilityDetails();
        renderStepDetails();
        bindInteractions();
      }

      window.addEventListener("popstate", render);
      render();
    </script>
  </body>
</html>
